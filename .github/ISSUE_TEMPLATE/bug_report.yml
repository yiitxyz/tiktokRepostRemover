name: Bug report
description: Report a reproducible extension problem without sharing session data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include cookies, secUid values, authentication headers, or full private request URLs.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 2.0.1
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Brave, Chrome, Edge, Other Chromium]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include sanitized logs prefixed with TikTok Repost Remover when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
