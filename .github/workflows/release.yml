name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: zip -r "tiktok-repost-remover-${GITHUB_REF_NAME}.zip" dist
      - run: gh release create "$GITHUB_REF_NAME" "tiktok-repost-remover-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
